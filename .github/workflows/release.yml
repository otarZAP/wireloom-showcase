name: Release
# Push a tag like v0.2.0 (e.g. `npm version minor && git push --follow-tags`) and this
# builds the Windows installer, runs every test, and publishes a GitHub Release with the
# installer + latest.yml — which is also the feed the installed app updates from.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Core tests
        run: npm test
      - name: Build the app
        run: npm run build
      - name: Browser tests (headless Edge)
        run: npm run test:e2e
      - name: Check the tag matches package.json
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} doesn't match package.json version $v"; exit 1; }
      - name: Build installer and publish the release
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
