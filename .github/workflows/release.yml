name: Release
# Push a tag like v0.2.0 (e.g. `npm version minor && git push --follow-tags`) and this
# builds the Windows installer, runs every test, and publishes a GitHub Release with the
# installer + latest.yml — which is also the feed the installed app updates from.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Core tests
        run: npm test
      - name: Build the app
        run: npm run build
      - name: Browser tests (headless Edge)
        run: npm run test:e2e
      - name: Check the tag matches package.json
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} doesn't match package.json version $v"; exit 1; }
      # electron-builder only BUILDS. Its own uploader raced itself creating the release on
      # v0.1.0's first run and silently dropped the installer, so publishing is done by the
      # GitHub CLI in one step that fails loudly if any file is missing.
      - name: Build the installer
        run: npx electron-builder --win --publish never
      - name: Publish the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          files=("release/Wireloom-Setup-$v.exe" "release/Wireloom-Setup-$v.exe.blockmap" "release/latest.yml")
          for f in "${files[@]}"; do [ -f "$f" ] || { echo "missing build output: $f"; exit 1; }; done
          awk -v v="$v" '$0 ~ "^## "v" " {f=1; next} /^## / && f {exit} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no '## $v' section"; exit 1; }
          cat .github/release-footer.md >> notes.md
          gh release create "$GITHUB_REF_NAME" "${files[@]}" --title "Wireloom $v" --notes-file notes.md
          gh release view "$GITHUB_REF_NAME" --json assets -q '.assets[].name'
